name: Build toolchain

# Manually triggered build of this fork, for testing compiler patches.
#
# "compiler" builds the compiler and standard library only.
#
# "toolchain" builds the full Linux toolchain with the buildbot_linux,no_test
# preset. It does not fit a standard GitHub-hosted runner (4 cores, 6 hour job
# limit), so pass the label of a larger or self-hosted runner as "runner".
#
# The job stops at "minutes" (30 by default). The build is stopped a few
# minutes before that so the sccache cache can still be saved, and a re-run
# then reuses the C and C++ objects compiled so far.
on:
  workflow_dispatch:
    inputs:
      build:
        description: What to build
        type: choice
        options:
          - compiler
          - toolchain
        default: compiler
      runner:
        description: Runner label (the full toolchain needs a larger or self-hosted runner)
        type: string
        default: ubuntu-24.04
      scheme:
        description: update-checkout scheme for the other repositories
        type: string
        default: main
      minutes:
        description: Job time limit in minutes (GitHub-hosted runners stop at 360)
        type: number
        default: 30
  # TEMPORARY: validates the workflow on its pull request; removed before merge.
  pull_request:
    paths:
      - .github/workflows/build-toolchain.yml
      - .github/scripts/build-toolchain.sh

permissions:
  contents: read

concurrency:
  group: build-toolchain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD: ${{ inputs.build || 'compiler' }}
  SCHEME: ${{ inputs.scheme || 'main' }}
  MINUTES: ${{ inputs.minutes || 30 }}
  # Official Swift 6.2.4 image, the host toolchain swift-ci uses on Ubuntu 24.04.
  SWIFT_IMAGE: swift:6.2.4-noble@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784

jobs:
  build:
    name: Build ${{ inputs.build || 'compiler' }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.minutes || 30 }}
    steps:
      - name: Set build deadline
        run: |
          # Leave 5 minutes after the build to save the cache and the package.
          echo "DEADLINE=$(( $(date +%s) + (MINUTES - 5) * 60 ))" >> "$GITHUB_ENV"

      - name: Free disk space
        if: runner.environment == 'github-hosted' && env.BUILD == 'toolchain'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          docker image prune --all --force
          df -h / /mnt

      - name: Choose build directory
        run: |
          # GitHub-hosted runners have a larger scratch disk at /mnt.
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            root=/mnt/swift-build
            sudo mkdir -p "$root"
            sudo chown "$(id -u):$(id -g)" "$root"
          else
            root="$RUNNER_TEMP/swift-build"
            mkdir -p "$root"
          fi
          mkdir -p "$root/sccache"
          echo "BUILD_ROOT=$root" >> "$GITHUB_ENV"
          df -h / "$root"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: swift
          persist-credentials: false

      - name: Restore sccache cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILD_ROOT }}/sccache
          key: sccache-${{ env.BUILD }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-${{ env.BUILD }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$BUILD_ROOT:/build" \
            -e SWIFT_SOURCE_ROOT=/src \
            -e SWIFT_BUILD_ROOT=/build \
            -e SCCACHE_DIR=/build/sccache \
            -e SCCACHE_CACHE_SIZE=6G \
            "$SWIFT_IMAGE" \
            /src/swift/.github/scripts/build-toolchain.sh "$BUILD" "$SCHEME" "$DEADLINE"

      - name: Save sccache cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILD_ROOT }}/sccache
          key: sccache-${{ env.BUILD }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload package
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-${{ env.BUILD }}-linux-${{ runner.arch }}
          path: ${{ env.BUILD_ROOT }}/swift-*-linux.tar.gz
          if-no-files-found: error
